<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gradient Grid Shader</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uTime:       { value: 0 },
  uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
  // Per-channel noise frequencies — independent R/G/B noise gives the fluid plasma feel.
  uRGBr: { value: 0.70 },
  uRGBg: { value: 0.55 },
  uRGBb: { value: 0.90 },
  // Detail / structure noise (kept subtle so it doesn't wash saturation).
  uRGBn: { value: 2.00 },
  uRGBm: { value: 0.25 },
  // Temporal flow speed.
  uFlow: { value: 0.20 },
};

const vertexShader = /* glsl */`
  void main() { gl_Position = vec4(position, 1.0); }
`;

const fragmentShader = /* glsl */`
precision highp float;

uniform float uTime;
uniform vec2  uResolution;
uniform float uRGBr, uRGBg, uRGBb, uRGBn, uRGBm, uFlow;

// ---------------------------------------------------------------------
// Classic 3D Perlin noise -- Stefan Gustavson / Ashima Arts, MIT license.
// Quintic fade gives the very smooth, fluid character of the reference pen.
// ---------------------------------------------------------------------
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
vec3 fade(vec3 t) { return t*t*t*(t*(t*6.0 - 15.0) + 10.0); }

float cnoise(vec3 P) {
  vec3 Pi0 = floor(P);
  vec3 Pi1 = Pi0 + vec3(1.0);
  Pi0 = mod289(Pi0); Pi1 = mod289(Pi1);
  vec3 Pf0 = fract(P);
  vec3 Pf1 = Pf0 - vec3(1.0);
  vec4 ix  = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
  vec4 iy  = vec4(Pi0.yy, Pi1.yy);
  vec4 iz0 = Pi0.zzzz;
  vec4 iz1 = Pi1.zzzz;
  vec4 ixy  = permute(permute(ix) + iy);
  vec4 ixy0 = permute(ixy + iz0);
  vec4 ixy1 = permute(ixy + iz1);
  vec4 gx0 = ixy0 * (1.0 / 7.0);
  vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
  gx0 = fract(gx0);
  vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
  vec4 sz0 = step(gz0, vec4(0.0));
  gx0 -= sz0 * (step(0.0, gx0) - 0.5);
  gy0 -= sz0 * (step(0.0, gy0) - 0.5);
  vec4 gx1 = ixy1 * (1.0 / 7.0);
  vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
  gx1 = fract(gx1);
  vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
  vec4 sz1 = step(gz1, vec4(0.0));
  gx1 -= sz1 * (step(0.0, gx1) - 0.5);
  gy1 -= sz1 * (step(0.0, gy1) - 0.5);
  vec3 g000 = vec3(gx0.x, gy0.x, gz0.x);
  vec3 g100 = vec3(gx0.y, gy0.y, gz0.y);
  vec3 g010 = vec3(gx0.z, gy0.z, gz0.z);
  vec3 g110 = vec3(gx0.w, gy0.w, gz0.w);
  vec3 g001 = vec3(gx1.x, gy1.x, gz1.x);
  vec3 g101 = vec3(gx1.y, gy1.y, gz1.y);
  vec3 g011 = vec3(gx1.z, gy1.z, gz1.z);
  vec3 g111 = vec3(gx1.w, gy1.w, gz1.w);
  vec4 norm0 = taylorInvSqrt(vec4(dot(g000,g000), dot(g010,g010), dot(g100,g100), dot(g110,g110)));
  g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
  vec4 norm1 = taylorInvSqrt(vec4(dot(g001,g001), dot(g011,g011), dot(g101,g101), dot(g111,g111)));
  g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;
  float n000 = dot(g000, Pf0);
  float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
  float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
  float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
  float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
  float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
  float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
  float n111 = dot(g111, Pf1);
  vec3 fade_xyz = fade(Pf0);
  vec4 n_z  = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
  vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
  float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
  return 2.2 * n_xyz;
}

void main() {
  vec2 res = uResolution;
  vec2 uv  = (gl_FragCoord.xy - 0.5 * res) / res.y;

  // 3D sample point -- time is the third axis, so animation evolves smoothly.
  vec3 p = vec3(uv * 1.6, uTime * uFlow);

  // Plasma-style fluid color: independent Perlin noise per channel.
  // Same trick as the reference pen -- different frequencies make the
  // R, G, B fields slide across each other and produce a liquid feel.
  float r = cnoise(uRGBr * p + vec3(0.0,  0.0, 0.0));
  float g = cnoise(uRGBg * p + vec3(2.3,  4.7, 1.1));
  float b = cnoise(uRGBb * p + vec3(7.1, -3.2, 5.5));

  // Detail layer -- subtle structural variation added to all channels.
  float n = uRGBm * cnoise(uRGBn * p + vec3(0.0, 0.0, uTime * 0.05));

  vec3 col = vec3(r + n, g + n, b + n);
  // Remap roughly [-1.5, 1.5] -> [0, 1].
  col = clamp(0.5 + 0.4 * col, 0.0, 1.0);

  // Slight saturation boost so the channels stay visibly separate.
  float luma = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(luma), col, 1.25);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.85));

  // -----------------------------------------------------------------
  // Grid overlay -- thin lines tinted by the underlying gradient.
  // -----------------------------------------------------------------
  float cells = 32.0;
  vec2 g2 = fract(gl_FragCoord.xy / (res.y / cells)) - 0.5;
  float line = min(abs(g2.x), abs(g2.y));
  float lineWidth = 0.015;
  float gridMask = 1.0 - smoothstep(lineWidth, lineWidth + 0.008, line);

  // Lines pick up the local color, slightly brighter -- keeps things cohesive.
  float brightness = dot(col, vec3(0.299, 0.587, 0.114));
  vec3 lineColor   = col + 0.25;
  col = mix(col, lineColor, gridMask * (0.25 + 0.45 * brightness));

  // Soft vignette to focus the eye.
  float v = smoothstep(1.3, 0.2, length(uv));
  col *= 0.55 + 0.45 * v;

  gl_FragColor = vec4(col, 1.0);
}
`;

const quad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader })
);
scene.add(quad);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uResolution.value.set(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
